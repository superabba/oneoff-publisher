<!doctype html>
<meta charset="utf-8">
<style>
  @font-face { font-family: Pretendard; font-weight: 100 900; src: url("/fonts/Pretendard-Bold.otf"); }
  html, body { margin: 0; background: #F2E6D0; }
  canvas { display: block; }
</style>
<canvas id="c" width="1600" height="900"></canvas>
<script type="module">
// Isometric Infographic 스타일(lemomo-ai/lemo-opuscar, 엔진 MIT)로 정지 그림 한 장을 그린다.
// 주소 뒤 ?d=<JSON>  →  { title, sub, objects:[{kind,label,num?} (1~3개)], route:true }
// kind: doc · calc · coins · store · usim · phone · chart · card
import { Iso, PAL, haloText, pin, tri } from '/tools/vendor/lemo-opuscar/engine.js';

const spec = JSON.parse(new URLSearchParams(location.search).get('d') || '{}');
await document.fonts.load('600 26px Pretendard');
await document.fonts.load('700 26px Pretendard');

const cv = document.getElementById('c'), g = cv.getContext('2d');
g.fillStyle = PAL.bg; g.fillRect(0, 0, 1600, 900);
g.fillStyle = 'rgba(46,37,34,.07)';
for (let y = 0; y < 900; y += 36) for (let x = (y / 36 % 2) * 18; x < 1600; x += 36) g.fillRect(x, y, 3, 3);

const iso = new Iso(g, 1600, 900);
iso.cam = { x: .4, y: .6, z: 2.4, k: 47 };
const WHITE = tri('#FFFFFF', 0, .2), GLASS = tri('#EAF3FA', .1, .1), KEY = tri('#F2F6FA', .1, .1);

// 물건은 가운데 x(=개체 번호에 따라 정해진 자리)에 놓이고, 말풍선 핀을 꽂을 [x,y,z]를 돌려준다
const KINDS = {
  doc(x) {
    for (let i = 0; i < 6; i++) iso.box(x - 2.1 + (i % 2) * .18, -2.8 + (i % 3) * .12, i * .4, 4.2, 5.6, .36, WHITE);
    const top = 5 * .4 + .36 + .02;
    for (let r = 0; r < 5; r++) iso.flat([[x - 1.5, -2 + r], [x - 1.5 + (r % 2 ? 2.6 : 3.2), -2 + r], [x - 1.5 + (r % 2 ? 2.6 : 3.2), -1.75 + r], [x - 1.5, -1.75 + r]], top, '#CFC8B8', { layer: 1, depth: x - 2.8 });
    iso.cyl(x + .6, 1.2, top, .95, .1, PAL.red);
    return [x + .6, 1.2, top + .2];
  },
  calc(x) {
    iso.box(x - 1.8, -2.8, 0, 3.6, 5.6, 1.5, PAL.blue);
    iso.box(x - 1.4, -2.4, 1.5, 2.8, 1.5, .16, GLASS);
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) iso.box(x - 1.3 + c, -.5 + r, 1.5, .78, .78, .2, r === 2 && c === 2 ? PAL.mustard : KEY);
    return [x, 0, 1.9];
  },
  coins(x) {
    [6, 4, 2].forEach((h, i) => { for (let k = 0; k < h; k++) iso.cyl(x + (i === 1 ? .2 : 0), -3 + i * 3, k * .42, 1.35, .38, PAL.mustard); });
    return [x + .2, 0, 4 * .42 + .1];
  },
  store(x) {
    iso.box(x - 2.2, -2.4, 0, 4.4, 4.8, 3.2, WHITE);
    iso.box(x - 2.4, -2.6, 3.2, 4.8, 5.2, .45, PAL.red);
    iso.box(x - .5, -2.55, 0, 1.3, .08, 2.1, PAL.blue, { bias: 3 });
    iso.box(x + 1.0, -2.55, 1.1, 1.0, .08, 1.3, GLASS, { bias: 3 });
    return [x, 0, 3.9];
  },
  usim(x) {
    iso.box(x - 1.6, -2.6, 0, 3.2, 2.2, .35, PAL.mustard);
    iso.box(x - .3, -2.0, .35, .9, .9, .08, tri('#FFF4CC', .1, .1));
    iso.box(x - 1.6, .4, 0, 3.2, 2.2, .35, PAL.green);
    iso.box(x - .3, 1.0, .35, .9, .9, .08, tri('#E5F2DC', .1, .1));
    return [x, -1.5, .5];
  },
  phone(x) {
    iso.box(x - 1.3, -.9, 0, 2.6, 1.8, 4.4, tri('#2E2522', .1, .05));
    iso.box(x - 1.1, -.95, .3, 2.2, .06, 3.8, GLASS, { bias: 3 });
    iso.box(x - .8, -1.0, 2.6, 1.6, .06, .6, PAL.blue, { bias: 4 });
    iso.box(x - .8, -1.0, 1.6, 1.0, .06, .3, tri('#CFE6F5', .1, .1), { bias: 4 });
    return [x, 0, 4.7];
  },
  chart(x) {
    [1.2, 2.2, 3.2, 4.4].forEach((h, i) => iso.box(x - 2.1 + i * 1.1, -1.2, 0, .9, 2.4, h, i === 3 ? PAL.mustard : PAL.blue));
    return [x + 1.2, 0, 4.6];
  },
  card(x) {
    iso.box(x - 2.2, -1.8, 0, 4.4, 3.6, .3, PAL.blue);
    iso.box(x - 2.2, -.9, .3, 4.4, .5, .06, tri('#2E2522', .1, .05));
    iso.box(x - 1.7, .4, .3, 1.0, .8, .08, PAL.mustard);
    return [x, 0, .6];
  },
};

const objs = (spec.objects || []).slice(0, 3);
const slots = { 1: [.8], 2: [-3, 4.4], 3: [-5.2, .6, 6] }[objs.length] || [.8];
iso.box(-8.5, -6.5, -.95, 17, 14, .95, tri('#CBDDCD', .1, .2), { layer: 0, depth: 0 });
iso.box(-8.5, -6.5, -1.4, 17, 14, .45, PAL.soil, { layer: 0, depth: -1 });
const pins = objs.map((o, i) => ({ at: (KINDS[o.kind] || KINDS.doc)(slots[i]), o, i }));
if (spec.route !== false) {
  iso.line3([[-7, 5.2, .06], [5.6, 5.2, .06]], PAL.ink, 3, { dash: [11, 8] });
  iso.flat([[5.6, 4.5], [6.8, 5.2], [5.6, 5.9]], .08, PAL.ink, { layer: 0, depth: 100 });
}
iso.flush();
const ups = objs.length < 3 ? [60, 120, 150] : [140, 190, 150], dirs = [-1, 1, 1];
pins.forEach(({ at, o, i }) => pin(iso, at[0], at[1], at[2], { title: o.label || '', num: o.num || '', dir: dirs[i], up: ups[i], len: 70, ts: 34, ns: 56, a: 1 }));

haloText(g, spec.title || '', 800, 92, { font: '700 64px Pretendard', align: 'center', hw: 10 });
if (spec.sub) haloText(g, spec.sub, 800, 140, { font: '600 30px Pretendard', align: 'center', color: '#8A5B3A', hw: 8 });
document.title = 'ready';
</script>
